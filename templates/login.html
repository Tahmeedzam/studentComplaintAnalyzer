{% extends "base.html" %}

{% block title %}Sign In - Smart Student Complaint Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-md border-0">
            <div class="card-header bg-white text-center py-4 border-bottom">
                <i class="bi bi-mortarboard-fill text-primary fs-1 mb-2"></i>
                <h4 class="fw-bold mb-1">Welcome Back</h4>
                <p class="text-muted small mb-0">Sign in to your student or administrative account</p>
            </div>
            
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@smartcampus.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                    </button>
                </form>

                <!-- Quick-Fill Demo Credentials (Convenience for College Viva/Demo) -->
                <div class="mt-4 pt-3 border-top">
                    <div class="small fw-bold text-muted mb-2 text-center">Quick Demo Credentials (1-Click Fill)</div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-danger btn-sm w-50" onclick="fillDemoCredentials('admin')">
                            <i class="bi bi-shield-lock me-1"></i>Fill Admin
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm w-50" onclick="fillDemoCredentials('student')">
                            <i class="bi bi-person me-1"></i>Fill Student
                        </button>
                    </div>
                </div>
            </div>

            <div class="card-footer bg-light text-center py-3 border-top">
                <span class="small text-muted">Don't have a student account? </span>
                <a href="{{ url_for('auth.register') }}" class="small fw-semibold">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
