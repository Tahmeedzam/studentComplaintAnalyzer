{% extends "base.html" %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="display-1 text-danger fw-bold mb-2">500</div>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. Please try again later or contact support.
        </p>
        <a href="{{ url_for('routes.index') }}" class="btn btn-primary">
            <i class="bi bi-house-door me-1"></i>Return to Home
        </a>
    </div>
</div>
{% endblock %}
