{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="display-1 text-primary fw-bold mb-2">404</div>
        <h3 class="fw-bold mb-3">{{ message or "Page Not Found" }}</h3>
        <p class="text-muted mb-4">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{{ url_for('routes.index') }}" class="btn btn-primary">
            <i class="bi bi-house-door me-1"></i>Return to Home
        </a>
    </div>
</div>
{% endblock %}
