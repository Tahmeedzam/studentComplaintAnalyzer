{% extends "base.html" %}

{% block title %}Student Registration - Smart Student Complaint Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-md border-0">
            <div class="card-header bg-white text-center py-4 border-bottom">
                <i class="bi bi-person-plus-fill text-primary fs-1 mb-2"></i>
                <h4 class="fw-bold mb-1">Create Student Account</h4>
                <p class="text-muted small mb-0">Join SmartCampus Grievance Redressal Portal</p>
            </div>
            
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label small fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Aarav Sharma" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">College Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="student@smartcampus.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label small fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Register Account
                    </button>
                </form>
            </div>

            <div class="card-footer bg-light text-center py-3 border-top">
                <span class="small text-muted">Already registered? </span>
                <a href="{{ url_for('auth.login') }}" class="small fw-semibold">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
